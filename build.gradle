// -*- Mode: Gradle; tab-width: 4; indent-tabs-mode: nil; -*-
// vim: et ts=4 sts=4 sw=4 syntax=groovy
//
// Step 1 of toolchain migration: Gradle 5.1.1 -> 8.10.2, AGP 3.4.2 -> 8.7.3.
// Behaviour-neutral by design: targetSdk stays 29, minSdk stays 14.
// Changes forced by the toolchain are marked with "MIGRATION:" comments.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // MIGRATION: AGP 3.4.2 -> 8.7.3 (requires Gradle >= 8.9, JDK >= 17)
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'jacoco'

wrapper {
    // MIGRATION: was 5.1.1 / ALL
    gradleVersion = '9.1.0'
    distributionType = Wrapper.DistributionType.BIN
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation 'com.luckycatlabs:SunriseSunsetCalculator:1.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // MIGRATION: dagger 2.10 (2017) -> 2.48.1; the 2.10 annotation processor
    // is not reliable under JDK 17. API used here (@Module/@Component/@Inject)
    // is unchanged between the versions.
    implementation 'com.google.dagger:dagger:2.48.1'
    implementation 'org.jetbrains:annotations-java5:15.0'

    annotationProcessor 'com.google.dagger:dagger-compiler:2.48.1'

    testImplementation 'junit:junit:4.13.2'
    // MIGRATION: powermock 1.6.5 + mockito 1.x cannot run on JDK 17.
    // powermock-api-mockito was renamed to powermock-api-mockito2 in 2.x.
    testImplementation 'org.mockito:mockito-core:2.28.2'
    testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
    testImplementation 'org.hamcrest:hamcrest-integration:1.3'
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    testImplementation 'com.luckycatlabs:SunriseSunsetCalculator:1.1'

    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}

android {
    // MIGRATION: namespace replaces the manifest package attribute (AGP 8 requirement)
    namespace 'com.aragaer.jtt'

    sourceSets {
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    // MIGRATION: compileSdk 29 -> 35 (compile-time only; runtime behaviour is
    // governed by targetSdk, which stays 29 until step 2)
    compileSdk 35
    // MIGRATION: buildToolsVersion dropped - AGP picks its bundled default

    defaultConfig {
        testApplicationId "com.aragaer.jtt.test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion 14
        targetSdkVersion 35
        // MIGRATION: resConfigs -> resourceConfigurations
        resourceConfigurations += ["en", "ru", "de", "ja", "b+zh+Hant"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // MIGRATION: guard the release signing config; the old file crashed at
    // configuration time when RELEASE_* properties were absent.
    def hasReleaseKeys = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD',
                          'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
            .every { project.hasProperty(it) }
    signingConfigs {
        if (hasReleaseKeys) {
            release {
                storeFile file(System.getenv('HOME') + '/' + RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    testOptions {
        animationsDisabled = true
        unitTests.all {
            // MIGRATION: powermock/objenesis need reflective access on JDK 17
            jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.util=ALL-UNNAMED'
        }
    }

    buildTypes {
        debug {
            // MIGRATION: testCoverageEnabled was split in AGP 8
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
        release {
            minifyEnabled true
            proguardFile 'proguard.cfg'
            if (hasReleaseKeys) {
                signingConfig signingConfigs.release
            }
            shrinkResources true
        }
    }

    lint {
        // keep lintVitalRelease from blocking assembleRelease on legacy warnings
        abortOnError = false
    }
}

// MIGRATION: jacoco tasks rewritten for the Gradle 8 lazy-property API;
// exec/class paths updated to current AGP output locations.
task jacocoTestReport(type: JacocoReport, dependsOn: "testDebugUnitTest") {
    group = "Reporting"
    description = "Generate Jacoco coverage reports after running tests."
    reports {
        xml.required = true
        html.required = true
    }

    classDirectories.setFrom(fileTree(
        dir: layout.buildDirectory.dir('intermediates/javac/debug/classes'),
        excludes: ['**/R.class',
                   '**/R$*.class',
                   '**/Dagger*Component.class',
                   '**/Dagger*Component$Builder.class',
                   '**/*Module_*Factory.class'
    ]))
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(layout.buildDirectory.files('jacoco/testDebugUnitTest.exec'))
}

task jacocoTestReportQuick(type: JacocoReport, dependsOn: "test") {
    reports.html.required = true

    classDirectories.setFrom(tasks.jacocoTestReport.classDirectories)
    sourceDirectories.setFrom(tasks.jacocoTestReport.sourceDirectories)
    executionData.setFrom(layout.buildDirectory.files('jacoco/testReleaseUnitTest.exec'))
}

gradle.taskGraph.whenReady { graph ->
    // MIGRATION: guard by name - the task does not exist in every AGP 8 graph
    if (graph.allTasks.any { it.name == "createDebugAndroidTestCoverageReport" }) {
        android.defaultConfig.testInstrumentationRunnerArgument "notAnnotation", "androidx.test.filters.LargeTest"
    }
}

tasks.withType(Test).configureEach {
    testLogging.exceptionFormat = 'full'
}
